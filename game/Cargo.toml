[package]
name = "tomb-raider-ii"
description = "Tomb Raider II (PlayStation) on the engine crate: its rules, controllers, menus and content."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The game is a library (`game`) so that integration tests in `tests/` and
# tools can drive it; `src/main.rs` is the thin executable.
[lib]
name = "game"
path = "src/lib.rs"

[features]
default = []
dev-mcp = ["engine/dev-mcp"]
# Tests that read content baked from the disc (game/assets/levels, ...).
# Run tools/bake_assets.sh first; a clean clone builds and tests without it.
baked-assets = []

[dependencies]
engine = { path = "../engine" }
bevy.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
base64.workspace = true
image.workspace = true
