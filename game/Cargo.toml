[package]
name = "tomb-raider-ii"
description = "Tomb Raider II (PlayStation) on the engine crate: its rules, controllers, menus and content."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The game is a library (`game`) so that integration tests in `tests/` and
# tools can drive it; `src/main.rs` is the thin executable.
[lib]
name = "game"
path = "src/lib.rs"

[features]
default = []
dev-mcp = ["engine/dev-mcp"]
# Tests that read content imported from the disc (game/assets/imported).
# Run the game once with the disc beside it, or `cargo run -p import -- DISC`;
# a clean clone builds and tests without it.
baked-assets = []

[dependencies]
engine = { path = "../engine" }
# The importers and disc reader (tools/import), run in the game on first start.
import.workspace = true
bevy.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
base64.workspace = true
image.workspace = true
